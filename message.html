<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="message.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Dancing+Script:wght@400;500;600&family=Inter:wght@400;500&family=Nunito:wght@400;500&display=swap"
        rel="stylesheet">

    <title>A Letter For You</title>

</head>


<body>

        <audio id="backgroundMusic" preload="auto" loop>
            <source src="audio/thousand_years.mp3" type="audio/mpeg">
        </audio>

        <main>

        <section class="message-page">

            <!-- Background glow -->
            <div class="message-glow"></div>


            <!-- Small floating hearts -->
            <div class="message-hearts" aria-hidden="true">

                <span>♡</span>
                <span>♥</span>
                <span>♡</span>
                <span>♥</span>
                <span>♡</span>
                <span>♥</span>

            </div>

            <!-- Fireflies -->
            <div class="fireflies" aria-hidden="true">

                <span class="firefly f1"></span>
                <span class="firefly f2"></span>
                <span class="firefly f3"></span>
                <span class="firefly f4"></span>
                <span class="firefly f5"></span>
                <span class="firefly f6"></span>
                <span class="firefly f7"></span>
                <span class="firefly f8"></span>
                <span class="firefly f9"></span>
                <span class="firefly f10"></span>
                <span class="firefly f11"></span>
                <span class="firefly f12"></span>

                <span class="firefly f13"></span>
                <span class="firefly f14"></span>
                <span class="firefly f15"></span>
                <span class="firefly f16"></span>
                <span class="firefly f17"></span>
                <span class="firefly f18"></span>
                <span class="firefly f19"></span>
                <span class="firefly f20"></span>
                <span class="firefly f21"></span>
                <span class="firefly f22"></span>
                <span class="firefly f23"></span>
                <span class="firefly f24"></span>

                <span class="firefly f25"></span>
                <span class="firefly f26"></span>
                <span class="firefly f27"></span>
                <span class="firefly f28"></span>
                <span class="firefly f29"></span>
                <span class="firefly f30"></span>

            </div>


            <!-- Envelope area -->

            <div class="letter-scene">


                <!-- Small introduction -->

                <p class="letter-eyebrow">
                    A little something for you...
                </p>


                <!-- Envelope -->

                <button
                    class="envelope-button"
                    id="openLetter"
                    type="button"
                    aria-label="Open the letter">

                    <div class="envelope">


                        <!-- Letter -->

                        <div class="letter">

                            <div class="letter-content">

                                <p class="letter-small">
                                    For you,
                                </p>

                                <h1>
                                    Dakshiiii
                                </h1>

                                <div class="letter-line"></div>

                                <div class="personal-message">

                                    <p>
                                        There are some things
                                        that are difficult to say
                                        out loud...
                                    </p>

                                    <p>
                                        So I thought I'd put them
                                        here, where you can take
                                        your time reading them.
                                    </p>

                                    <p>
                                        Happy Birthday to someone
                                        who holds a very special
                                        place in my heart.
                                    </p>

                                </div>

                                <p class="letter-signature">
                                    With love ♡
                                </p>

                            </div>

                        </div>


                        <!-- Envelope back -->

                        <div class="envelope-back"></div>


                        <!-- Envelope front -->

                        <div class="envelope-front"></div>


                        <!-- Envelope flap -->

                        <div class="envelope-flap"></div>


                        <!-- Heart seal -->

                        <div class="envelope-seal">
                            ♡
                        </div>


                    </div>

                </button>


                <!-- Hint -->

                <p class="open-hint">
                    Open when you're ready... ♡
                </p>

            </div>

            <!-- =========================================
                 JOURNEY FIREFLY GUIDE
            ========================================== -->

            <div class="journey-guide">

                <div class="guide-firefly">
                    🐝
                </div>

                <a href="vault.html" class="journey-button">
                    Memories
                    <span>→</span>
                </a>

            </div>


        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
