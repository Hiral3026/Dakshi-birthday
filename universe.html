<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Our Universe</title>


    <!-- =================================
         GOOGLE FONTS
    ================================= -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap"
        rel="stylesheet"
    >


    <!-- =================================
         MAIN CSS
    ================================= -->

    <link
        rel="stylesheet"
        href="universe.css"
    >

</head>


<body>

<main class="universe">

    <!-- =========================================
        BACKGROUND MUSIC
    ========================================= -->

    <div class="music-player">

        <audio
            id="vaultMusic"
            loop
            preload="auto"
        >
            <source
                src="audio/memory_audio.wav"
                type="audio/wav"
            >
        </audio>

    </div>

    <!-- =================================
         MAIN HEADING
    ================================= -->

    <section class="universe-heading">

        <h1>OUR UNIVERSE</h1>

        <p>Two constellations. One story.</p>

    </section>

    <!-- =================================
        MEMORY GUIDE
    ================================= -->

    <div class="memory-guide">
        <div class="memory-guide-star">✦</div>

        <h2>Somewhere between the stars, our story began.</h2>

        <a href="memory.html">✦ Begin our journey ✦</a>
    </div>



    <!-- =================================
         CANCER CONSTELLATION
    ================================= -->

    <div class="cancer-constellation">


        <!-- =================================
             CANCER CONSTELLATION LINES
        ================================= -->

        <svg
            class="cancer-lines"
            viewBox="0 0 500 650"
            preserveAspectRatio="none"
            aria-hidden="true"
        >

            <line
                x1="45"
                y1="65"
                x2="125"
                y2="145"
            />

            <line
                x1="125"
                y1="145"
                x2="205"
                y2="325"
            />

            <line
                x1="205"
                y1="325"
                x2="205"
                y2="420"
            />

            <line
                x1="205"
                y1="325"
                x2="330"
                y2="385"
            />

            <line
                x1="330"
                y1="385"
                x2="425"
                y2="350"
            />

            <line
                x1="205"
                y1="420"
                x2="145"
                y2="555"
            />

            <line
                x1="145"
                y1="555"
                x2="160"
                y2="635"
            />

            <line
                x1="205"
                y1="420"
                x2="315"
                y2="505"
            />

        </svg>



        <!-- =================================
             CANCER STARS

             ================================= -->

        <span
            class="cancer-star star-1 memory-star"
        ></span>


        <span
            class="cancer-star star-2"
        ></span>


        <span
            class="cancer-star star-3 memory-star"
        ></span>


        <span
            class="cancer-star star-4"
        ></span>


        <span
            class="cancer-star star-5 memory-star"
        ></span>


        <span
            class="cancer-star star-6"
        ></span>


        <span
            class="cancer-star star-7 memory-star"
        ></span>


        <span
            class="cancer-star star-8"
        ></span>


        <span
            class="cancer-star star-9 memory-star"
        ></span>


    </div>



    <!-- =================================
         PISCES CONSTELLATION
    ================================= -->

    <div class="pisces-constellation">


        <!-- =================================
             PISCES CONSTELLATION LINES
        ================================= -->

        <svg
            class="pisces-lines"
            viewBox="0 0 500 650"
            preserveAspectRatio="none"
            aria-hidden="true"
        >

            <!-- Upper Pisces -->

            <line
                x1="160"
                y1="70"
                x2="90"
                y2="205"
            />

            <line
                x1="160"
                y1="70"
                x2="225"
                y2="235"
            />

            <line
                x1="90"
                y1="205"
                x2="205"
                y2="255"
            />

            <line
                x1="225"
                y1="235"
                x2="205"
                y2="255"
            />


            <!-- Lower Pisces -->

            <line
                x1="205"
                y1="255"
                x2="260"
                y2="375"
            />

            <line
                x1="260"
                y1="375"
                x2="315"
                y2="485"
            />

            <line
                x1="315"
                y1="485"
                x2="400"
                y2="555"
            />

            <line
                x1="400"
                y1="555"
                x2="480"
                y2="600"
            />

        </svg>



        <!-- =================================
             PISCES STARS

             ================================= -->

        <span
            class="pisces-star pisces-star-1 memory-star"
        ></span>


        <span
            class="pisces-star pisces-star-2"
        ></span>


        <span
            class="pisces-star pisces-star-3 memory-star"
        ></span>


        <span
            class="pisces-star pisces-star-4"
        ></span>


        <span
            class="pisces-star pisces-star-5 memory-star"
        ></span>


        <span
            class="pisces-star pisces-star-6"
        ></span>


        <span
            class="pisces-star pisces-star-7"
        ></span>


        <span
            class="pisces-star pisces-star-8"
        ></span>


    </div>



    <!-- =================================
         COUPLE IMAGE
    ================================= -->

    <img
        src="images/universe-mascot.png"
        alt="Couple sitting beneath the stars"
        class="couple"
    >


</main>



<!-- =================================
     JAVASCRIPT
================================= -->

<script src="universe.js"></script>


</body>

</html>
