<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Make a Wish</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@300;400;500&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="final.css">
</head>

<body>

    <!-- =================================
         STAR BACKGROUND
    ================================== -->

    <div class="stars" aria-hidden="true">

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

    </div>


    <!-- =================================
         SHOOTING STAR
    ================================== -->

    <div class="shooting-star" aria-hidden="true"></div>


    <!-- =================================
         MAIN PAGE
    ================================== -->

    <main class="birthday-page">

        <section class="wish-section">


            <!-- =================================
                 INITIAL SCENE
            ================================== -->

            <div class="wish-content" id="wishContent">

                <div class="top-star">
                    ✦
                </div>

                <h1>
                    Make a Wish
                </h1>

                <p class="subtitle">
                    The universe is listening...
                </p>


                <!-- =================================
                     CANDLES
                ================================== -->

                <div class="candles" id="candles">

                    <!-- Candle 1 -->

                    <button
                        class="candle-wrapper"
                        type="button"
                        aria-label="Blow out candle"
                    >

                        <span class="flame"></span>

                        <span class="candle">
                            <span class="wax-detail"></span>
                        </span>

                        <span class="candle-base"></span>

                    </button>


                    <!-- Candle 2 -->

                    <button
                        class="candle-wrapper candle-middle"
                        type="button"
                        aria-label="Blow out candle"
                    >

                        <span class="flame"></span>

                        <span class="candle">
                            <span class="wax-detail"></span>
                        </span>

                        <span class="candle-base"></span>

                    </button>


                    <!-- Candle 3 -->

                    <button
                        class="candle-wrapper"
                        type="button"
                        aria-label="Blow out candle"
                    >

                        <span class="flame"></span>

                        <span class="candle">
                            <span class="wax-detail"></span>
                        </span>

                        <span class="candle-base"></span>

                    </button>

                </div>


                <p class="instruction">
                    Close your eyes and make a wish
                </p>

            </div>


            <!-- =================================
                 FINAL MESSAGE
            ================================== -->

            <div
                class="final-message"
                id="finalMessage"
            >

                <div class="message-star">
                    ✦
                </div>

                <h2>
                    Your wish is out there
                </h2>

                <p>
                    May this year bring you beautiful moments,
                    unexpected adventures, and countless reasons
                    to smile.
                </p>

                <div class="birthday-name">

                    Happy Birthday

                    <span>
                        Dakshiiii
                    </span>

                </div>

                <div class="message-star bottom">
                    ✦
                </div>

            </div>

        </section>

    </main>


    <script src="final.js"></script>

</body>
</html>
